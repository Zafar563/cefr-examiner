name: CI/CD Pipeline & Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Majburiy qayta deploy qilish'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # 1-BOSQICH: Kodni tekshirish va yig'ilishini sinovdan o'tkazish (CI)
  build-check:
    name: Build & Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Go muhitini sozlash
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: services/core-backend/go.sum

      - name: Go Backend yig'ilishini tekshirish
        run: |
          cd services/core-backend
          go mod download
          CGO_ENABLED=0 GOOS=linux go build -v -o /dev/null ./cmd/api

      - name: Node.js muhitini sozlash
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend Next.js yig'ilishini tekshirish
        run: |
          cd frontend
          npm ci
          NEXT_TELEMETRY_DISABLED=1 npm run build

  # 2-BOSQICH: Serverga SSH orqali avtomatik deploy qilish (CD)
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: build-check
    steps:
      - name: Serverga ulanish va yangilash
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH || '/var/www/cefr-examiner' }}"
            echo "🚀 [1/3] Server katalogi tekshirilmoqda: $DEPLOY_PATH"

            git config --global --add safe.directory "$DEPLOY_PATH" || true

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "📦 Yangi repozitoriy klonlanmoqda..."
              mkdir -p "$DEPLOY_PATH"
              git clone https://github.com/Zafar563/cefr-examiner.git "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"
            echo "🔄 [2/3] Yangi kod yuklanmoqda..."
            git fetch origin main
            git reset --hard origin/main

            echo "🏗️ [3/3] Deploy skripti ishga tushirilmoqda..."
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh

