# ==============================================================================
# CEFR Platformasi uchun Nginx Konfiguratsiyasi (Reverse Proxy)
# ==============================================================================
# Ushbu faylni serverda /etc/nginx/sites-available/cefr ga joylashtirib,
# ln -s /etc/nginx/sites-available/cefr /etc/nginx/sites-enabled/ qiling.
#
# Agar domen ulasangiz: server_name cefr.sizningdomen.uz;
# Agar faqat IP orqali ishlatmoqchi bo'lsangiz: server_name _;
# ==============================================================================

server {
    listen 80;
    server_name _; # O'zingizning domeningizni yozing, masalan: exam.domain.uz yoki server IP

    # Katta hajmdagi Speaking audio yozuvlari va fayllarni yuklash uchun
    client_max_body_size 100M;

    # Gzip siqish (Sahifalar tezroq ochilishi uchun)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";

    # 1. Python Media Service (Audio qabul qilish, streaming, saqlash)
    location /api/v1/media/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Katta audio yuklashda uzilish bo'lmasligi uchun
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    # 2. Go Core Backend API (Avtorizatsiya, testlar, savollar, baholash)
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 3. Next.js Frontend (Foydalanuvchi interfeysi va boshqaruv paneli)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }
}

# ==============================================================================
# Bepul SSL (HTTPS) sertifikatini o'rnatish uchun quyidagi buyruqni bering:
#   sudo certbot --nginx -d sizningdomen.uz
# ==============================================================================
